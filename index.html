<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AKATSUKI CHAT</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#050505;
  color:white;
  min-height:100vh;
}

button{cursor:pointer}

#home{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:25px;
  background:
    radial-gradient(circle,#350000,#100000 40%,#050505 75%);
}

.logo{
  font-size:48px;
  font-weight:900;
  letter-spacing:7px;
  color:#ff2020;
  text-shadow:0 0 15px red;
  margin-bottom:12px;
  text-align:center;
}

.subtitle{
  color:#aaa;
  letter-spacing:3px;
  margin-bottom:35px;
}

.roomBox{
  width:100%;
  max-width:430px;
}

.roomBox input{
  width:100%;
  padding:16px;
  background:#111;
  color:white;
  border:1px solid #700000;
  border-radius:10px;
  outline:none;
  font-size:16px;
  margin-bottom:10px;
}

.enter{
  width:100%;
  padding:15px;
  background:#d00000;
  color:white;
  border:0;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
}

#error{
  color:#ff3333;
  margin-top:15px;
  display:none;
}

#chat{
  display:none;
  height:100vh;
  flex-direction:column;
  background:#070707;
}

.header{
  padding:15px;
  background:#120000;
  border-bottom:1px solid #700000;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.title{
  color:#ff2020;
  font-weight:bold;
  letter-spacing:2px;
}

.exit{
  background:#111;
  color:white;
  border:1px solid #700000;
  padding:8px 12px;
  border-radius:7px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.message{
  max-width:85%;
  background:#181818;
  border-left:3px solid #d00000;
  padding:10px;
  border-radius:10px;
  margin-bottom:12px;
  word-wrap:break-word;
}

.message.me{
  margin-left:auto;
  background:#350000;
  border-left:0;
  border-right:3px solid red;
}

.message img{
  max-width:230px;
  width:100%;
  border-radius:8px;
  display:block;
}

.msgActions{
  margin-top:7px;
  display:flex;
  gap:5px;
}

.msgActions button{
  background:#111;
  color:#ddd;
  border:1px solid #600000;
  padding:5px 8px;
  border-radius:5px;
  font-size:11px;
}

.time{
  color:#777;
  font-size:10px;
  margin-top:5px;
}

.inputArea{
  padding:10px;
  background:#100000;
  border-top:1px solid #700000;
}

.inputRow{
  display:flex;
  gap:6px;
  align-items:center;
}

.textInput{
  flex:1;
  min-width:0;
  padding:13px;
  border-radius:9px;
  border:1px solid #500000;
  background:#151515;
  color:white;
  outline:none;
}

.iconBtn{
  width:43px;
  height:43px;
  border:0;
  border-radius:9px;
  background:#a00000;
  color:white;
  font-size:19px;
}

.send{
  background:#e00000;
}

.recording{
  background:#ff0000!important;
}

#cameraBox{
  display:none;
  padding:10px;
  background:#111;
  text-align:center;
}

#cameraPreview{
  width:100%;
  max-width:350px;
  border-radius:10px;
}

.cameraButtons{
  margin-top:8px;
  display:flex;
  justify-content:center;
  gap:8px;
}

.cameraButtons button{
  padding:9px 14px;
  border:0;
  border-radius:7px;
  background:#d00000;
  color:white;
}

@media(max-width:500px){
  .logo{
    font-size:40px;
    letter-spacing:5px;
  }

  .message{
    max-width:90%;
  }

  .iconBtn{
    width:40px;
    height:40px;
    font-size:17px;
  }
}
</style>
</head>

<body>

<section id="home">

  <div class="logo">AKATSUKI</div>

  <div class="subtitle">
    PRIVATE CHAT ROOMS
  </div>

  <div class="roomBox">

    <input
      id="roomCode"
      type="text"
      placeholder="Enter room code..."
      autocomplete="off"
    >

    <button class="enter" onclick="joinRoom()">
      JOIN ROOM
    </button>

  </div>

  <div id="error">
    Please enter a room code.
  </div>

</section>


<section id="chat">

  <header class="header">

    <div class="title">
      🔴 ROOM:
      <span id="roomName"></span>
    </div>

    <button class="exit" onclick="leaveRoom()">
      EXIT
    </button>

  </header>


  <div id="cameraBox">

    <video
      id="cameraPreview"
      autoplay
      playsinline>
    </video>

    <div class="cameraButtons">

      <button onclick="takePhoto()">
        📸 Take Photo
      </button>

      <button onclick="closeCamera()">
        ✖ Close
      </button>

    </div>

  </div>


  <main class="messages" id="messages"></main>


  <div class="inputArea">

    <div class="inputRow">

      <button
        class="iconBtn"
        onclick="openCamera()">
        📷
      </button>


      <input
        id="gallery"
        type="file"
        accept="image/*"
        hidden
        onchange="sendImage(event)"
      >

      <button
        class="iconBtn"
        onclick="document.getElementById('gallery').click()">
        🖼️
      </button>


      <button
        id="voiceButton"
        class="iconBtn"
        onclick="toggleVoice()">
        🎙️
      </button>


      <input
        id="messageInput"
        class="textInput"
        type="text"
        placeholder="Type message..."
        onkeydown="if(event.key==='Enter')sendMessage()"
      >


      <button
        class="iconBtn send"
        onclick="sendMessage()">
        ➤
      </button>

    </div>

  </div>

</section>
